[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = ["data", "checkpoints", "debug", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["datasets", "models", "utils"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = ["error::RuntimeWarning"]
