data:
  root: data/railsem19
  img_subdir: jpgs/rs19_val
  json_subdir: jsons/rs19_val
  seg_subdir: uint8/rs19_val
  rail_class_ids: [12, 17, 18]
  val_ratio: 0.1
  seed: 42

input:
  width: 800
  height: 288

anchors:
  num_rows: 56
  num_grid: 100
  row_start: 0.42
  row_end: 1.0

model:
  backbone: resnet18
  pretrained: true
  num_rails: 2
  use_aux_seg: true

loss:
  lambda_cls: 1.0
  lambda_sim: 1.0
  lambda_shp: 0.0
  lambda_seg: 1.0

train:
  epochs: 50
  batch_size: 32
  num_workers: 2
  lr: 0.001
  weight_decay: 0.0001
  warmup_epochs: 1
  ckpt_dir: checkpoints
  log_interval: 20

infer:
  ema: 0.0
  conf: 0.3
